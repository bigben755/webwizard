name: Apply portfolio homepage preview update

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/apply-portfolio-homepage-update.py'
      - '.github/workflows/apply-portfolio-homepage-update.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply portfolio changes
        run: python scripts/apply-portfolio-homepage-update.py

      - name: Commit patched page
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Redesign portfolio homepage previews [skip ci]"
          git push origin HEAD:main
