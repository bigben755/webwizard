name: Apply Web Wizard demo and professional update

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/apply-demo-professional-update.py'
      - '.github/workflows/apply-demo-professional-update.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply guarded updates
        run: python scripts/apply-demo-professional-update.py

      - name: Verify intended files changed
        run: |
          git diff --exit-code --quiet -- demo-editor.html index.html && {
            echo "Expected demo-editor.html and/or index.html changes were not produced."
            exit 1
          }
          git diff --check

      - name: Commit update and remove one-time helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo-editor.html index.html
          git rm scripts/apply-demo-professional-update.py .github/workflows/apply-demo-professional-update.yml
          git commit -m "Improve demo responsiveness and professional service positioning [skip ci]"
          git push origin HEAD:main
