name: Apply monthly pricing update

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/apply-monthly-pricing-update.py'
      - '.github/workflows/apply-monthly-pricing-update.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply guarded update
        run: python scripts/apply-monthly-pricing-update.py

      - name: Verify update
        run: |
          git diff --exit-code --quiet -- index.html && {
            echo "Expected index.html changes were not produced."
            exit 1
          }
          git diff --check
          grep -q '£10.75/month' index.html
          grep -q '£14.92/month' index.html
          grep -q '£24.92/month' index.html

      - name: Commit and clean up helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm scripts/apply-monthly-pricing-update.py .github/workflows/apply-monthly-pricing-update.yml
          git commit -m "Add 12-month payment options to website packages [skip ci]"
          git push origin HEAD:main
