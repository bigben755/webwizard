name: Apply monthly annual billing selector

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/apply-billing-toggle.py'
      - '.github/workflows/apply-billing-toggle.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply guarded update
        run: python scripts/apply-billing-toggle.py

      - name: Verify update
        run: |
          git diff --exit-code --quiet -- index.html && {
            echo "Expected index.html changes were not produced."
            exit 1
          }
          git diff --check
          grep -q 'id="billingToggle"' index.html
          grep -q 'Choose monthly — £11/month' index.html
          grep -q 'Choose annual —' index.html
          grep -q 'data-annual-url="https://buy.stripe.com/14AeVf2AjaXZbFF5XF77O02"' index.html
          grep -q 'Website Care is optional and billed separately at £6.99 per month' index.html

      - name: Commit and clean up helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm scripts/apply-billing-toggle.py .github/workflows/apply-billing-toggle.yml
          git commit -m "Add monthly and annual pricing selector [skip ci]"
          git push origin HEAD:main
