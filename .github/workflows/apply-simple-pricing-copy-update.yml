name: Apply simple pricing and copy update

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/apply-simple-pricing-copy-update.py'
      - '.github/workflows/apply-simple-pricing-copy-update.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply guarded update
        run: python scripts/apply-simple-pricing-copy-update.py

      - name: Verify update
        run: |
          git diff --exit-code --quiet -- index.html && {
            echo "Expected index.html changes were not produced."
            exit 1
          }
          git diff --check
          grep -q '£132' index.html
          grep -q '£11/month' index.html
          grep -q '£180' index.html
          grep -q '£15/month' index.html
          grep -q '£300' index.html
          grep -q '£25/month' index.html
          grep -q 'A proper website, without being locked out of it.' index.html

      - name: Commit and clean up helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm scripts/apply-simple-pricing-copy-update.py .github/workflows/apply-simple-pricing-copy-update.yml
          git commit -m "Simplify pricing and update ownership copy [skip ci]"
          git push origin HEAD:main
