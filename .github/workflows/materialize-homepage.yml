name: Materialise homepage customer-control section

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  materialise:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply customer-facing homepage section
        run: python3 scripts/inject-customer-control.py

      - name: Commit homepage if changed
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "Homepage already contains the customer-control section."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add customer-control section to homepage source"
          git push
