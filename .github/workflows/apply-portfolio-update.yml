name: Apply portfolio update

on:
  push:
    branches:
      - portfolio-update
    paths:
      - 'scripts/apply-portfolio-update.py'
      - 'assets/portfolio/**'
      - '.github/workflows/apply-portfolio-update.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: portfolio-update
          fetch-depth: 0

      - name: Apply portfolio changes
        run: python scripts/apply-portfolio-update.py

      - name: Commit patched page
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update portfolio showcase [skip ci]"
          git push origin HEAD:portfolio-update
