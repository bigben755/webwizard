name: Diagnose live Web Wizard domain

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check live domain routing and content
        shell: bash
        run: |
          set +e
          echo "=== DNS: apex ==="
          getent ahosts thewebdesignwizard.co.uk || true
          echo "=== DNS: www ==="
          getent ahosts www.thewebdesignwizard.co.uk || true
          echo "=== HTTP HEADERS: apex ==="
          curl -sSIL --max-time 20 https://thewebdesignwizard.co.uk/ || true
          echo "=== HTTP HEADERS: www ==="
          curl -sSIL --max-time 20 https://www.thewebdesignwizard.co.uk/ || true
          echo "=== LIVE CONTENT CHECK ==="
          curl -sSL --max-time 20 https://thewebdesignwizard.co.uk/ -o /tmp/live.html || true
          echo -n "Customer-control heading: "
          grep -Fq "We build it. You stay in control." /tmp/live.html && echo FOUND || echo NOT_FOUND
          echo -n "Demo-editor hero link: "
          grep -Fq "Try the website editor" /tmp/live.html && echo FOUND || echo NOT_FOUND
          echo -n "Homepage title: "
          grep -o '<title>[^<]*</title>' /tmp/live.html | head -1 || true
          echo "=== FIRST RESPONSE BYTES ==="
          head -c 300 /tmp/live.html || true
          echo
